<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="900" viewBox="100 80 1040 900" font-family="Helvetica, Arial, sans-serif" role="img"><title>SRSE System Diagram</title><desc>Market data from US and European sources reaches SpiderRock Connect market data servers, which publish it on the SpiderRock multicast message bus. SRSE/SQL servers, algo execution engines and street gateways all read from and write to the bus. Client programs query and insert data through the SRSE/SQL servers with a MariaDB-compatible SQL client, and street gateways route orders to exchanges, alternative trading systems and other market access brokers.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c4c9d4"/></marker></defs><rect x="100" y="80" width="1040" height="900" fill="#1c2129"/><text x="360" y="114" font-size="20" font-weight="bold" text-anchor="middle" fill="#e5e7eb">Market Data Sources</text><text x="360" y="143" font-size="18" font-weight="normal" text-anchor="middle" fill="#e5e7eb">US: OPRA, CME, ICE, and direct</text><text x="360" y="167" font-size="18" font-weight="normal" text-anchor="middle" fill="#e5e7eb">stock and option feeds</text><text x="360" y="191" font-size="18" font-weight="normal" text-anchor="middle" fill="#e5e7eb">Europe: Eurex, Euronext, ICE Futures</text><text x="360" y="215" font-size="18" font-weight="normal" text-anchor="middle" fill="#e5e7eb">Europe, and Cboe Europe</text><text x="720" y="114" font-size="20" font-weight="bold" text-anchor="middle" fill="#e5e7eb">Client Programs and Scripts</text><text x="720" y="143" font-size="18" font-weight="normal" text-anchor="middle" fill="#e5e7eb">Connect with a MariaDB-compatible</text><text x="720" y="167" font-size="18" font-weight="normal" text-anchor="middle" fill="#e5e7eb">SQL client over cross-connect or VPN</text><rect x="140" y="270" width="960" height="560" rx="2" fill="#262a37" stroke="#6b7280" stroke-width="1.6"/><text x="166" y="786" font-size="20" font-weight="bold" text-anchor="start" fill="#e5e7eb">SpiderRock Connect Data Centers</text><text x="166" y="810" font-size="18" font-weight="normal" text-anchor="start" fill="#e5e7eb">NY5 and DC3 (US), FR2 (Europe)</text><path d="M 240.0 344 A 120.0 14 0 0 1 480.0 344 V 430 A 120.0 14 0 0 1 240.0 430 Z" fill="#33293d" stroke="#a58bbd" stroke-width="1.2"/><ellipse cx="360" cy="344" rx="120.0" ry="14" fill="#33293d" stroke="#a58bbd" stroke-width="1.2"/><text x="360" y="394.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#e5e7eb">Market Data Servers</text><path d="M 600.0 344 A 120.0 14 0 0 1 840.0 344 V 430 A 120.0 14 0 0 1 600.0 430 Z" fill="#1f3127" stroke="#6fa35a" stroke-width="1.2"/><ellipse cx="720" cy="344" rx="120.0" ry="14" fill="#1f3127" stroke="#6fa35a" stroke-width="1.2"/><text x="720" y="394.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#e5e7eb">SRSE/SQL Servers</text><text x="866" y="350" font-size="18" font-weight="normal" text-anchor="start" fill="#a3aab8">Clients can select live</text><text x="866" y="374" font-size="18" font-weight="normal" text-anchor="start" fill="#a3aab8">market data, analytics,</text><text x="866" y="398" font-size="18" font-weight="normal" text-anchor="start" fill="#a3aab8">risk, and trading data</text><text x="866" y="422" font-size="18" font-weight="normal" text-anchor="start" fill="#a3aab8">on the fly</text><rect x="240" y="500" width="760" height="70" rx="2" fill="#1d2b40" stroke="#6f93c6" stroke-width="1.2"/><text x="620" y="541" font-size="21" font-weight="bold" text-anchor="middle" fill="#e5e7eb">SpiderRock Multicast Message Bus</text><path d="M 350.0 654 A 120.0 14 0 0 1 590.0 654 V 740 A 120.0 14 0 0 1 350.0 740 Z" fill="#35301c" stroke="#c9a94a" stroke-width="1.2"/><ellipse cx="470" cy="654" rx="120.0" ry="14" fill="#35301c" stroke="#c9a94a" stroke-width="1.2"/><text x="470" y="692.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#e5e7eb">Algo Execution</text><text x="470" y="716.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#e5e7eb">Engines</text><path d="M 730.0 654 A 120.0 14 0 0 1 970.0 654 V 740 A 120.0 14 0 0 1 730.0 740 Z" fill="#3a2c1d" stroke="#d69a3a" stroke-width="1.2"/><ellipse cx="850" cy="654" rx="120.0" ry="14" fill="#3a2c1d" stroke="#d69a3a" stroke-width="1.2"/><text x="850" y="704.0" font-size="19" font-weight="bold" text-anchor="middle" fill="#e5e7eb">Street Gateways</text><path d="M 360 236 L 360 322" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 695 200 L 695 322" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 745 322 L 745 200" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 360 444 L 360 498" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 695 444 L 695 498" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 745 498 L 745 444" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 445 572 L 445 632" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 495 632 L 495 572" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 825 572 L 825 632" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 875 632 L 875 572" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><path d="M 850 754 L 850 878" fill="none" stroke="#c4c9d4" stroke-width="1.4" marker-end="url(#arrow)"/><text x="850" y="906" font-size="20" font-weight="bold" text-anchor="middle" fill="#e5e7eb">Low-Latency Infrastructure</text><text x="850" y="934" font-size="18" font-weight="normal" text-anchor="middle" fill="#e5e7eb">to exchanges, alternative trading systems,</text><text x="850" y="958" font-size="18" font-weight="normal" text-anchor="middle" fill="#e5e7eb">and other market access brokers</text></svg>